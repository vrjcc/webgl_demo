<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Display | Persona Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="common.js"></script>
  <style>
    /* ブラウザ全体を使用するための基本設定 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f0f0f0;
    }
    /* 切り替え用ボタンを画面左上に配置 */
    #toggle-controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10000;
    }
    #toggle-controls button {
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      margin-right: 10px;
    }
    /* Unity コンテナ：デフォルトはブラウザ全体に表示 */
    #unity-container.fullsize {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    /* 小さい表示用：例として 960×600、ウィンドウ中央に配置 */
    #unity-container.small {
      position: absolute;
      width: 960px;
      height: 600px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #000;
      border: 2px solid #ccc;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    /* Unity キャンバスは親要素にフィット */
    #unity-canvas {
      width: 100%;
      height: 100%;
    }
    /* ローディングバーなどの補助要素 */
    #unity-loading-bar {
      position: absolute;
      width: 100%;
      height: 4px;
      bottom: 0;
      left: 0;
    }
    #unity-progress-bar-full {
      height: 100%;
      background-color: #4caf50;
      width: 0%;
    }
  </style>
</head>
<body>
  <!-- 切り替え用ボタン（サイズ切替とフルスクリーン切替の両方を配置） -->
  <div id="toggle-controls">
    <button id="toggle-size-btn">小さくする</button>
    <button id="toggle-fullscreen-btn">フルスクリーンオン</button>
  </div>

  <!-- 任意のヘッディングや設定への戻りボタン -->
  <h1 style="margin:20px;">実行画面</h1>
  <button onclick="window.location='settings.html'" style="margin:20px;">設定に戻る</button>

  <!-- MediaPipe 関連（任意表示） -->
  <form id="paramForm" style="margin:20px;">
    <input type="hidden" id="focalLength" value="5">
    <input type="hidden" id="sensorWidth" value="5">
    <input type="hidden" id="ipd" value="65">
    <input type="hidden" id="diagonalFov" value="78">
    <input type="hidden" id="requestedWidth" value="640">
    <input type="hidden" id="requestedHeight" value="360">
    <input type="hidden" id="_fps" value="30">
    <select id="cameraSelect"></select>
  </form>
  <div id="videoContainer" style="margin:20px; width:640px; height:360px; border:1px solid #ccc; position:relative;">
    <video id="video" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>
  <div id="result" style="margin:20px;">結果はここに表示されます。</div>

  <!-- Unity WebGL コンテナ（初期状態は全体表示） -->
  <div id="unity-container" class="fullsize">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-full"></div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer"></div>
  </div>

  <script>
    // 共通関数で設定読み込みとカメラ起動
    loadSettings();
    startCamera();

    // 切り替え用ボタン（サイズ切替）の処理
    const toggleBtn = document.getElementById('toggle-size-btn');
    const unityContainer = document.getElementById('unity-container');
    let isFullSize = true;
    toggleBtn.addEventListener('click', function() {
      if (isFullSize) {
        // 現在全体表示 → 小さいサイズに切り替え
        unityContainer.classList.remove('fullsize');
        unityContainer.classList.add('small');
        toggleBtn.textContent = '全体に戻す';
      } else {
        // 小さいサイズ → 全体表示に戻す
        unityContainer.classList.remove('small');
        unityContainer.classList.add('fullsize');
        toggleBtn.textContent = '小さくする';
      }
      isFullSize = !isFullSize;
    });

    // フルスクリーン切替用ボタンの処理
    const toggleFullscreenBtn = document.getElementById('toggle-fullscreen-btn');
    toggleFullscreenBtn.addEventListener('click', function() {
      if (!document.fullscreenElement) {
        // フルスクリーン表示に切り替え
        unityContainer.requestFullscreen().then(() => {
          toggleFullscreenBtn.textContent = 'フルスクリーンオフ';
        }).catch(err => {
          console.error(`フルスクリーンの開始に失敗しました: ${err.message}`);
        });
      } else {
        // フルスクリーン表示の解除
        document.exitFullscreen().then(() => {
          toggleFullscreenBtn.textContent = 'フルスクリーンオン';
        }).catch(err => {
          console.error(`フルスクリーンの解除に失敗しました: ${err.message}`);
        });
      }
    });

    // Unity WebGL Loader
    const loaderUrl = 'Build/WebGL.loader.js';
    const unityCanvas = document.getElementById('unity-canvas');
    const script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(unityCanvas, {
        dataUrl: 'Build/WebGL.data.unityweb',
        frameworkUrl: 'Build/WebGL.framework.js.unityweb',
        codeUrl: 'Build/WebGL.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Portalgraph',
        productName: 'PersonaPortal',
        productVersion: '0.1',
        showBanner: (msg, type) => console.warn(msg)
      }, progress => {
        document.getElementById('unity-progress-bar-full').style.width = `${progress * 100}%`;
      }).then(unityInstance => {
        document.unityInstance = unityInstance;
        console.log('Unity instance ready');
      }).catch(err => console.error(err));
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
