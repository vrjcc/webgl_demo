<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Display | Persona Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="common.js"></script>
  <style>
    /* ブラウザ全体を使用するための基本設定 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background: #f0f0f0;
    }
    /* Unity コンテナ：デフォルトはブラウザ全体に表示 */
    #unity-container.fullsize {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 100;
    }
    /* 小さい表示用：例として 960×600、ウィンドウ中央に配置 */
    #unity-container.small {
      position: relative;
      width: 90%;
      height: 90%;
      background: #000;
      border: 2px solid #ccc;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      z-index: 0;
      margin: 0% 5% 5% 5%;
    }
    /* Unity キャンバスは親要素にフィット */
    #unity-canvas {
      width: 100%;
      height: 100%;
    }
    /* ローディングバーなどの補助要素 */
    #unity-loading-bar {
      position: absolute;
      width: 100%;
      height: 4px;
      bottom: 0;
      left: 0;
    }
    #unity-progress-bar-full {
      height: 100%;
      background-color: #4caf50;
      width: 0%;
    }
    /* フルスクリーンボタンを画面左上に配置 */
    #fullscreen-btn {
      z-index: 10;
      font-size: 14px;
      cursor: pointer;
    }
    #message-text {
      margin:20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1 style="margin:20px;">Persona Portal 陽炎 WebGLバージョン</h1>
  <div style="margin:20px; position: relative; white-space: pre;">
<h3>遊び方：</h3>
<a href="https://www.youtube.com/watch?v=rbYDKoHD3GA" target="_blank">チュートリアル動画</a>
初回、またはカメラを交換した際はカメラ設定をしてください。<button onclick="window.location='settings.html'">カメラ設定</button>
設定画面で画面サイズと、画面に対するカメラ位置を入力してください（スマホ、タブレットでは非フルスクリーン状態でのみ入力できます）。
市販の赤青メガネをかけて画面を見れば、画面の中に自由な角度で覗き込める3D空間が現れます。
<a href="https://www.amazon.co.jp/dp/B08D6HM397?ref_=cm_sw_r_cp_ud_dp_VX6RYTV9MRAFPN6XV8GY">おすすめ3Dメガネ</a>

<button id="fullscreen-btn">フルスクリーンにしてお楽しみください</button>
  </div>


  <!-- Unity WebGL コンテナ-->
  <div id="unity-container" class="small">
    <canvas id="unity-canvas" style="display: block;"></canvas>
    
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-full"></div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer"></div>
 </div>

  <!-- MediaPipe 関連（任意表示） -->
  <form id="paramForm" style="margin:20px; display: none;">
    <input type="hidden" id="relativeFocalLength" value="5">
    <input type="hidden" id="ipd" value="65">
    <input type="hidden" id="diagonalFov" value="78">
    <input type="hidden" id="requestedWidth" value="640">
    <input type="hidden" id="requestedHeight" value="360">
    <input type="hidden" id="_fps" value="30">
    <select id="cameraSelect" style="display: none;"></select>
  </form>
  <div id="videoContainer" style="display: inline-block; margin:20px; border:1px solid #ccc; position:relative;">
    <video id="video" playsinline></video>
    <canvas id="output_canvas" style="display: none;"></canvas>
  </div>
  <div id="result" style="margin:20px;">結果はここに表示されます。</div>

  <script>
    cameraSettingUrl = "settings.html";
    helpUrl = "https://www.youtube.com/watch?v=rbYDKoHD3GA";
    const unityContainer = document.getElementById('unity-container');
    
    if(!localStorage.getItem('ipd')) {
      window.location = cameraSettingUrl;
    }
    
    // 共通関数で設定読み込みとカメラ起動
    loadSettings();
    startCamera();

    document.addEventListener('fullscreenchange', () => {
      const isFullscreen = !!document.fullscreenElement;
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      fullscreenBtn.style.display = isFullscreen ? 'none' : 'block';
    });

    // フルスクリーンボタンの処理
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', function() {
      if (!document.fullscreenElement) {
        // フルスクリーン表示に切り替え
        unityContainer.requestFullscreen().then(() => {
          toggleFullscreenBtn.textContent = 'フルスクリーンオフ';
        }).catch(err => {
          console.error(`フルスクリーンの開始に失敗しました: ${err.message}`);
        });
      }
    });

    // Unity WebGL Loader
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/ittouryoudan_webgl.loader.js";
    const unityCanvas = document.getElementById('unity-canvas');
    const script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(unityCanvas, {
        arguments: [],
        dataUrl: buildUrl + "/ittouryoudan_webgl.data.gz",
        frameworkUrl: buildUrl + "/ittouryoudan_webgl.framework.js.gz",
        codeUrl: buildUrl + "/ittouryoudan_webgl.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "TiltBrushDemos",
        productVersion: "0.1",
        showBanner: (msg, type) => console.warn(msg)
      }, progress => {
        document.getElementById('unity-progress-bar-full').style.width = `${progress * 100}%`;
      }).then(unityInstance => {
        document.unityInstance = unityInstance;
        console.log('Unity instance ready');
      }).catch(err => console.error(err));
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
