<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Settings | Persona Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="common.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    form { max-width: 600px; margin-bottom: 20px; }
    fieldset { border: 1px solid #ccc; margin-bottom: 20px; padding: 10px; }
    legend { font-weight: bold; padding: 0 5px; }
    label { display: block; margin: 8px 0; }
    #videoContainer { width: 640px; height: 360px; border: 1px solid #ccc; position: relative; margin-top: 20px; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #calibrationResult { margin: 12px 0; color: #007acc; }
  </style>
</head>
<body>
  <h1>設定</h1>
  <form id="paramForm">
    <!-- グループ1: IPD -->
    <fieldset>
      <legend>IPD</legend>
      <label>両目間距離 (mm): 65 <input type="hidden" id="ipd" value="65"></label>
    </fieldset>

    <!-- グループ2: Camera, Resolution, fps -->
    <fieldset>
      <legend>カメラ設定</legend>
      <label>Camera: <select id="cameraSelect"></select></label>
      <label>解像度: <input type="number" id="requestedWidth" step="10" value="640"> × <input type="number" id="requestedHeight" step="10" value="360"></label>
      <label>フレームレート (fps): <input type="number" id="_fps" step="1" value="30"></label>
    </fieldset>

    <!-- グループ3: RelativeFocalLength, FOV, Calibrate -->
    <fieldset>
      <legend>キャリブレーション設定</legend>
      <label>相対焦点距離: <input type="number" id="relativeFocalLength" step="0.001" value="1"></label>
      <label>視野角 (°): <input type="number" id="diagonalFov" step="1" value="78"></label>
      <button type="button" id="calibrate-btn">キャリブレート</button>
      クリックしたら、カメラ正面50cmに両目の中間が来るようにしてカウントダウンを待機してください。<br><img width='270' height='160' src="calibration.png">
    </fieldset>

    <button type="submit">OK</button>
  </form>

  <div id="calibrationResult"></div>
  <div id="result"></div>

  <div id="videoContainer">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    loadSettings(); populateCameraSelect();
    document.getElementById('paramForm').addEventListener('submit', e => {
      e.preventDefault(); saveSettings(); window.location = 'display.html';
    });
    startCamera();

    // キャリブレーションボタン
    document.getElementById('calibrate-btn').addEventListener('click', () => {
      calibration.startCalibration();
    });
  </script>
</body>
</html>
